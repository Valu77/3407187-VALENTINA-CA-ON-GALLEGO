<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱 Ficha Técnica Agronómica | AgroAsesor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header class="header">
      <h1>🌾 Gestión de Fichas Agronómicas</h1>
      <p class="subtitle">Sistema de asesoría y seguimiento técnico de cultivos</p>
      <div class="stats-summary">
        <span class="stat">Total Fichas: <strong id="stat-total">0</strong></span>
        <span class="stat">En Monitoreo: <strong id="stat-active">0</strong></span>
        <span class="stat">Finalizadas: <strong id="stat-inactive">0</strong></span>
      </div>
    </header>

    <!-- Formulario -->
    <section class="form-section">
      <h2 id="form-title">➕ Nueva Ficha de Cultivo</h2>
      <form id="item-form" class="item-form">
        <input type="hidden" id="item-id">

        <div class="form-group">
          <label for="item-name">Nombre del Cultivo *</label>
          <input type="text" id="item-name" placeholder="Ej: Maíz Amarillo" required>
        </div>

        <div class="form-group">
          <label for="item-description">Observaciones Técnicas</label>
          <textarea id="item-description" rows="3"
            placeholder="Estado fenológico, recomendaciones, problemas detectados..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="item-category">Tipo de Cultivo</label>
            <select id="item-category">
              <option value="cereal">🌽 Cereal</option>
              <option value="hortaliza">🥦 Hortaliza</option>
              <option value="frutal">🍎 Frutal</option>
              <option value="leguminosa">🌱 Leguminosa</option>
              <option value="otro">🌾 Otro</option>
            </select>
          </div>

          <div class="form-group">
            <label for="item-priority">Nivel de Atención</label>
            <select id="item-priority">
              <option value="low">🟢 Bajo</option>
              <option value="medium" selected>🟡 Medio</option>
              <option value="high">🔴 Urgente</option>
            </select>
          </div>
        </div>

        <!-- Campos adicionales específicos del dominio agronómico -->
        <div class="form-row">
          <div class="form-group">
            <label for="item-area">Área (hectáreas)</label>
            <input type="number" id="item-area" step="0.1" placeholder="Ej: 2.5">
          </div>

          <div class="form-group">
            <label for="item-date">Fecha de Evaluación</label>
            <input type="date" id="item-date">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Guardar Ficha</button>
          <button type="button" class="btn btn-secondary" id="cancel-btn" style="display: none;">
            Cancelar
          </button>
        </div>
      </form>
    </section>

    <!-- Filtros -->
    <section class="filters-section">
      <div class="filters">

        <div class="filter-group">
          <label for="filter-status">Estado:</label>
          <select id="filter-status">
            <option value="all">Todos</option>
            <option value="active">En Monitoreo</option>
            <option value="inactive">Finalizados</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-category">Tipo:</label>
          <select id="filter-category">
            <option value="all">Todos</option>
            <option value="cereal">Cereal</option>
            <option value="hortaliza">Hortaliza</option>
            <option value="frutal">Frutal</option>
            <option value="leguminosa">Leguminosa</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="search-input">Buscar:</label>
          <input type="text" id="search-input"
            placeholder="Buscar por cultivo o recomendación...">
        </div>

      </div>
    </section>

    <!-- Lista de Fichas -->
    <section class="items-section">
      <div class="items-header">
        <h2>📋 Fichas Registradas</h2>
        <button class="btn btn-outline" id="clear-inactive">
          🗑️ Limpiar Finalizadas
        </button>
      </div>

      <div id="item-list" class="item-list"></div>

      <div id="empty-state" class="empty-state">
        <p>🌾 No hay fichas registradas</p>
        <p class="empty-state-hint">
          Crea tu primera ficha técnica usando el formulario
        </p>
      </div>
    </section>

    <!-- Estadísticas -->
    <section class="detailed-stats">
      <h3>📊 Estadísticas de Seguimiento</h3>
      <div id="stats-details" class="stats-grid"></div>
    </section>

  </div>

  <script src="starter/script.js"></script>
</body>
</html>
